name: shadow_run
description: SHADOW//RUN — a fast-paced cyberpunk action runner.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get_storage: ^2.1.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  audioplayers: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# get_storage → path_provider still resolves an old `file` that breaks on Dart 3.8+.
dependency_overrides:
  file: ^7.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/branding/
    - assets/characters/runner/
    - assets/characters/hunter/
    - assets/characters/blade/
    - assets/characters/phantom/
    - assets/weapons/
    - assets/vfx/
    - assets/images/
    - assets/projectiles/
    - assets/hazards/
    - assets/enemies/grunt/
    - assets/enemies/raptor/
    - assets/enemies/sentinel/
    - assets/enemies/shocker/
    - assets/enemies/guardian/
    - assets/enemies/drone_swarmer/
    - assets/enemies/shield_maiden/
    - assets/enemies/executioner/
    - assets/enemies/void_stalker/
    - assets/enemies/scout_drone/
    - assets/enemies/missile_drone/
    - assets/enemies/bomber_drone/
    - assets/enemies/sniper_drone/
    - assets/enemies/steel_brute/
    - assets/enemies/war_machine/
    - assets/enemies/fortress/
    - assets/enemies/chaos_engineer/
    - assets/enemies/rift_reaper/
    - assets/enemies/corrupted_wraith/
    - assets/enemies/juggernaut/
    - assets/enemies/overseer/
    - assets/enemies/warp_behemoth/
    - assets/enemies/apex_sentinel/
