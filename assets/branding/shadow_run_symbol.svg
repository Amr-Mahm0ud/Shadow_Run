<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="SHADOW//RUN symbol">
  <defs>
    <linearGradient id="metal" x1="24" y1="16" x2="108" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#E8EDF5"/>
      <stop offset="100%" stop-color="#8B94A6"/>
    </linearGradient>
    <linearGradient id="cyan" x1="40" y1="18" x2="112" y2="116" gradientUnits="userSpaceOnUse">
