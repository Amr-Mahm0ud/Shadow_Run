  <path d="M62 28 L80 28" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="square" opacity="0.55"/>
  <path d="M48 88 L66 88" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="square" opacity="0.75"/>
